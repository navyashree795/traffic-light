<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Traffic Signal Detection</h1>
            <p>Real-time computer vision + Audio alerts</p>
        </header>
        
        <main>
            <div class="video-container">
                <img src="{{ url_for('video_feed') }}" id="videoFeed" alt="Live Video Feed">
                <div class="status-overlay" id="statusOverlay">
                    Waiting for signal...
                </div>
            </div>
            
            <div class="info-panel">
                <div class="color-indicator" id="colorIndicator">
                    <div class="light red" id="lightRed"></div>
                    <div class="light yellow" id="lightYellow"></div>
                    <div class="light green" id="lightGreen"></div>
                </div>
                
                <div class="current-status">
                    <h2>Detected Status:</h2>
                    <h3 id="colorText" class="none">None</h3>
                </div>
                
                <div class="controls">
                    <button id="audioToggle" class="btn active">Audio Alerts: ON</button>
                    <!-- Provide instructions for mobile camera if needed -->
                    <p class="help-text">Point camera at a traffic light (or a screen displaying one).</p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
